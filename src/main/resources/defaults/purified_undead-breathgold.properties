conversionTicks=200
# Stack limits 1..64, durability 1..1000000.
materialStackSize=64
oreStackSize=64
toolDurability=375
# Mining speed 0..1024, enchantability 0..255, tier damage bonus 0..1024.
miningSpeed=6
enchantability=14
tierDamageBonus=2
# Per-tool damage is added to tier damage; attackSpeed is a modifier on player base 4.
# Damage -2..1024 (whole numbers except shovel), attackSpeed -3.99..16.
sword.damage=4
sword.attackSpeed=-2.4
axe.damage=6
axe.attackSpeed=-3.1
hoe.damage=-2
hoe.attackSpeed=-1.0
