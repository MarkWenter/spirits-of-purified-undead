hoe.damage=-2
hoe.attackSpeed=-1.0
pickaxe.damage=1
pickaxe.attackSpeed=-2.8
shovel.damage=1.5
shovel.attackSpeed=-3.0

# Armor: gold enchantability, iron defense, 150% iron durability rounded up.
